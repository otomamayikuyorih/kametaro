<h1>lvsem</h1>
<p>
<strong>lvsem</strong> は、PLS-SEM（偏最小二乗構造方程式モデリング）を  
シンプルに扱うための R パッケージ（開発中）です。  
文系のためのデータサイエンスを目的とし、<strong>直感的なモデル指定・効果分解</strong>を重視しています。
</p>

<h2>特徴</h2>
<ul>
  <li>シンプルで直感的なモデル指定</li>
  <li>PLS-SEM に特化した軽量設計</li>
  <li>直接効果・間接効果・総効果の自動計算</li>
  <li>文系データ解析・教育用途を想定</li>
</ul>

<h2>開発状況</h2>
<ul>
  <li>現在 個人開発中</li>
  <li>GitHub で公開予定</li>
  <li>vignette / サンプルデータを追加予定</li>
</ul>
